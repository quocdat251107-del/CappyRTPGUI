# ======================================================= #
#                    CAPPY RTP GUI CONFIG                 #
# ======================================================= #
# MiniMessage format is fully supported!
# Use <red>, <bold>, or hex colors like <#ff0000>
# ======================================================= #

dialog:
  title: "<gradient:#55ff55:#00aa00>❖ RANDOM TELEPORT ❖</gradient>"
  # The text displayed above the world selector
  description: "<gray>Select the world you wish to teleport to:</gray>"
  # The world selected by default when the GUI opens.
  # NOTE: Due to vanilla Minecraft client limitations, radio buttons do not send live 
  # updates to the server. Therefore, the Information Card below will statically display 
  # the info of THIS default destination when the menu first opens.
  default-destination: "overworld"

chest-gui:
  title: "<dark_gray>» <green><bold>Random Teleport</bold>"
  size: 27

destinations:
  overworld:
    display-name: "<green>Overworld"
    world: "world"
    permission: "cappyrtp.world.overworld"
    # The 3D item displayed in the Java Dialog API
    java-icon: DIRT
    chest-gui:
      gui-slot: 11
    # The Information Card displayed in the middle of the Dialog API.
    # Fully customizable! Use \n to create new lines, or leave empty ("") to hide.
    dialog-card:
      lore: "<gray>Lush biomes and vast oceans await.</gray>"
      specs: "<gray>Safe Landing: <green>Active</green>\n<gray>Radius: <yellow>10000</yellow></gray>"
      tip: "<italic><dark_gray>Tip: Watch out for creepers at night!</dark_gray></italic>"

  nether:
    display-name: "<red>The Nether"
    world: "world_nether"
    permission: "cappyrtp.world.nether"
    java-icon: NETHERRACK
    chest-gui:
      gui-slot: 13
    dialog-card:
      lore: "<gray>A treacherous inferno filled with danger.</gray>"
      specs: "<gray>Safe Landing: <green>Active</green>\n<gray>Radius: <yellow>5000</yellow></gray>"
      tip: "<italic><dark_gray>Tip: Never sleep in a bed here!</dark_gray></italic>"

  end:
    display-name: "<light_purple>The End"
    world: "world_the_end"
    permission: "cappyrtp.world.end"
    java-icon: END_STONE
    chest-gui:
      gui-slot: 15
    dialog-card:
      lore: "<gray>A dark void scattered with floating islands.</gray>"
      specs: "<gray>Safe Landing: <green>Active</green>\n<gray>Radius: <yellow>2500</yellow></gray>"
      tip: "<italic><dark_gray>Tip: Keep your eyes on the ground.</dark_gray></italic>"

buttons:
  confirm: "<green>✔ Confirm</green>"
  cancel: "<red>✖ Cancel</red>"

messages:
  no-permission: "<red>You do not have permission to RTP to this world!</red>"
  teleporting: "<green>Finding a safe location and teleporting...</green>"
  not-found: "<red>The specified world was not found in BetterRTP!</red>"
