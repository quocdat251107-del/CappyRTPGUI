# ======================================================= #
#                    CAPPY RTP GUI CONFIG                 #
# ======================================================= #
# MiniMessage format is fully supported!
# Use <red>, <bold>, or hex colors like <#ff0000>
# ======================================================= #

dialog:
  title: "<gradient:#55ff55:#00aa00>❖ RANDOM TELEPORT ❖</gradient>"
  description: "<gray>Select the world you wish to teleport to:</gray>"
  default-destination: "overworld"
  
  # The Information Card displayed in the middle of the Dialog API.
  # This text is generic for all worlds. Use \n to create new lines, or leave empty ("") to hide.
  card:
    lore: "<gray>Choose a dimension below to embark on your journey.</gray>"
    tip: "<italic><dark_gray>Tip: Make sure you are well equipped before teleporting!</dark_gray></italic>"

chest-gui:
  title: "<dark_gray>» <green><bold>Random Teleport</bold>"
  size: 27

destinations:
  overworld:
    display-name: "<green>Overworld"
    world: "world"
    permission: "cappyrtp.world.overworld"
    java-icon: DIRT
    chest-gui:
      gui-slot: 11

  nether:
    display-name: "<red>The Nether"
    world: "world_nether"
    permission: "cappyrtp.world.nether"
    java-icon: NETHERRACK
    chest-gui:
      gui-slot: 13

  end:
    display-name: "<light_purple>The End"
    world: "world_the_end"
    permission: "cappyrtp.world.end"
    java-icon: END_STONE
    chest-gui:
      gui-slot: 15

buttons:
  confirm: "<green>✔ Confirm</green>"
  cancel: "<red>✖ Cancel</red>"

messages:
  no-permission: "<red>You do not have permission to RTP to this world!</red>"
  teleporting: "<green>Finding a safe location and teleporting...</green>"
  not-found: "<red>The specified world was not found in BetterRTP!</red>"
